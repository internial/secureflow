# Default values for secureflow.
# This is a YAML-formatted file.

replicaCount: 2

image:
  repository: secureflow-api
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

db:
  url: "jdbc:postgresql://postgres:5432/secureflow"
  username: "secureflow"
  password: "secureflow"

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 60

ingress:
  enabled: true
  className: "nginx"
  host: "localhost"
  # Annotations vary depending on the ingress class (Nginx vs AWS ALB)
  annotations: {}

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi
