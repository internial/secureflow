AWSTemplateFormatVersion: '2010-09-09'
Description: 'SecureFlow RDS PostgreSQL 16 Instance (Single AZ, db.t3.micro)'

Parameters:
  VpcStackName:
    Type: String
    Default: 'secureflow-vpc'
    Description: 'Name of the VPC stack to import subnet and network values'

  IamBaseStackName:
    Type: String
    Default: 'secureflow-iam-base'
    Description: 'Name of the IAM Base stack to import the RDS monitoring role ARN'

  DBUsername:
    Type: String
    Default: 'secureflow'
    Description: 'Username for the Database'

Resources:
  RdsKmsKey:
    Type: 'AWS::KMS::Key'
    Properties:
      Description: 'KMS key for RDS encryption at rest'
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'

  DBSubnetGroup:
    Type: 'AWS::RDS::DBSubnetGroup'
    Properties:
      DBSubnetGroupDescription: 'Subnets available for the RDS instance'
      SubnetIds:
        Fn::Split:
          - ','
          - Fn::ImportValue: !Sub '${VpcStackName}-PrivateSubnets'

  DBSecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      GroupDescription: 'Allow PostgreSQL port 5432 ingress from EKS nodes only'
      VpcId:
        Fn::ImportValue: !Sub '${VpcStackName}-VpcId'
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          Description: 'PostgreSQL access from EKS node security group'
          SourceSecurityGroupId:
            Fn::ImportValue: secureflow-eks-ClusterSecurityGroupId
      Tags:
        - Key: Name
          Value: 'secureflow-rds-sg'

  RDSInstance:
    Type: 'AWS::RDS::DBInstance'
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_157
            comment: "Single AZ intentional — demo environment, cost control over redundancy"
    DeletionPolicy: Delete
    Properties:
      DBInstanceIdentifier: 'secureflow-rds'
      DBName: 'secureflow'
      Engine: 'postgres'
      EngineVersion: '16'
      DBInstanceClass: 'db.t3.micro'
      AllocatedStorage: '20'
      MasterUsername: !Ref DBUsername
      # Use dynamic reference to Secrets Manager for the password
      MasterUserPassword: '{{resolve:ssm-secure:/secureflow/db/password}}'
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups:
        - !Ref DBSecurityGroup
      # Single AZ to minimize cost — demo environment only
      MultiAZ: false
      PubliclyAccessible: false
      StorageType: 'gp2'
      # Encryption at rest
      StorageEncrypted: true
      KmsKeyId: !Ref RdsKmsKey
      # Enhanced monitoring
      MonitoringInterval: 60
      MonitoringRoleArn:
        Fn::ImportValue: !Sub '${IamBaseStackName}-RdsMonitoringRoleArn'
      # IAM authentication
      EnableIAMDatabaseAuthentication: true
      Tags:
        - Key: Name
          Value: 'secureflow-db'

Outputs:
  RDSEndpoint:
    Value: !GetAtt RDSInstance.Endpoint.Address
    Export:
      Name: !Sub '${AWS::StackName}-RDSEndpoint'
