AWSTemplateFormatVersion: '2010-09-09'
Description: 'SecureFlow AWS Budget Alerts: Actual and Forecasted cost protection alarms'

Parameters:
  NotificationEmail:
    Type: String
    Default: 'PLACEHOLDER_EMAIL@example.com'
    Description: 'Email address to receive cost alert notifications'

Resources:
  SnsKmsKey:
    Type: 'AWS::KMS::Key'
    Properties:
      Description: 'KMS key for SNS topic encryption'
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Effect: Allow
            Principal:
              Service: 'budgets.amazonaws.com'
            Action:
              - 'kms:GenerateDataKey'
              - 'kms:Decrypt'
            Resource: '*'

  BudgetSnsTopic:
    Type: 'AWS::SNS::Topic'
    Properties:
      TopicName: 'secureflow-budget-alerts-topic'
      KmsMasterKeyId: !Ref SnsKmsKey
      Subscription:
        - Endpoint: !Ref NotificationEmail
          Protocol: 'email'

  BudgetSnsTopicPolicy:
    Type: 'AWS::SNS::TopicPolicy'
    Properties:
      Topics:
        - !Ref BudgetSnsTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: 'budgets.amazonaws.com'
            Action: 'sns:Publish'
            Resource: !Ref BudgetSnsTopic

  SecureFlowBudget:
    Type: 'AWS::Budgets::Budget'
    DependsOn: BudgetSnsTopicPolicy
    Properties:
      Budget:
        BudgetName: 'secureflow-sre-budget'
        BudgetType: 'COST'
        TimeUnit: 'MONTHLY'
        BudgetLimit:
          Amount: 50
          Unit: 'USD'
      NotificationsWithSubscribers:
        - Notification:
            ComparisonOperator: 'GREATER_THAN'
            NotificationType: 'ACTUAL'
            Threshold: 4
            ThresholdType: 'PERCENTAGE'
          Subscribers:
            - Address: !Ref NotificationEmail
              SubscriptionType: 'EMAIL'
            - Address: !Ref BudgetSnsTopic
              SubscriptionType: 'SNS'
        - Notification:
            ComparisonOperator: 'GREATER_THAN'
            NotificationType: 'ACTUAL'
            Threshold: 10
            ThresholdType: 'PERCENTAGE'
          Subscribers:
            - Address: !Ref NotificationEmail
              SubscriptionType: 'EMAIL'
            - Address: !Ref BudgetSnsTopic
              SubscriptionType: 'SNS'
        - Notification:
            ComparisonOperator: 'GREATER_THAN'
            NotificationType: 'ACTUAL'
            Threshold: 20
            ThresholdType: 'PERCENTAGE'
          Subscribers:
            - Address: !Ref NotificationEmail
              SubscriptionType: 'EMAIL'
            - Address: !Ref BudgetSnsTopic
              SubscriptionType: 'SNS'
        - Notification:
            ComparisonOperator: 'GREATER_THAN'
            NotificationType: 'FORECASTED'
            Threshold: 30
            ThresholdType: 'PERCENTAGE'
          Subscribers:
            - Address: !Ref NotificationEmail
              SubscriptionType: 'EMAIL'
            - Address: !Ref BudgetSnsTopic
              SubscriptionType: 'SNS'

Outputs:
  BudgetName:
    Value: !Ref SecureFlowBudget
  SnsTopicArn:
    Value: !Ref BudgetSnsTopic
