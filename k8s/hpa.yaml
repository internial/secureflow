apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: secureflow-hpa
  namespace: secureflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: secureflow
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
