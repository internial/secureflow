apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: secureflow-ingress-eks
  namespace: secureflow
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  ingressClassName: alb
  rules:
  # Comment: Replace "placeholder-alb-dns.amazonaws.com" with actual ALB DNS after aws-deploy is completed
  - host: placeholder-alb-dns.amazonaws.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: secureflow
            port:
              number: 80
