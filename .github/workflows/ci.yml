name: SecureFlow CI/CD Pipeline

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'scripts/**'
      - 'k8s/**'
      - 'cloudformation/**'
      - '.github/workflows/infra.yml'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'scripts/**'
      - 'k8s/**'
      - 'cloudformation/**'
      - '.github/workflows/infra.yml'

permissions:
  contents: read
  security-events: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Security & Quality Gates (run on every push and PR)
  # ─────────────────────────────────────────────────────────────────────────────
  git-secrets:
    name: git-secrets Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: git-secrets Secret Scan
        run: |
          git clone https://github.com/awslabs/git-secrets.git /tmp/git-secrets
          sudo make install -C /tmp/git-secrets
          git-secrets --register-aws
          if [ -f .git-secrets ]; then
            while IFS= read -r pattern; do
              [[ "$pattern" =~ ^#.*$ ]] && continue
              [[ -z "$pattern" ]] && continue
              git-secrets --add "$pattern" 2>/dev/null || true
            done < .git-secrets
          fi
          if ! git-secrets --scan; then
            echo "❌ SECURITY CHECK FAILED: Potential secrets found in repository!"
            exit 1
          fi
          echo "✅ No secrets found in repository"

  build-and-test:
    name: Build & Test (Java 21)
    runs-on: ubuntu-latest
    needs: git-secrets
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Compile and Test
        run: |
          cd app
          mvn -B clean verify

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: app/target/surefire-reports/

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java
          build-mode: manual

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build Application for CodeQL
        run: |
          cd app
          mvn -B clean package -DskipTests

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  # ─────────────────────────────────────────────────────────────────────────────
  # Docker Build & Push to ECR (main branch only)
  # ─────────────────────────────────────────────────────────────────────────────
  docker-build-push:
    name: Docker Build & Push to ECR
    runs-on: ubuntu-latest
    needs: codeql
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: secureflow
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./app
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  # ─────────────────────────────────────────────────────────────────────────────
  # Trivy Container Scan (main branch only)
  # ─────────────────────────────────────────────────────────────────────────────
  trivy:
    name: Trivy Container Scan
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/secureflow:${{ github.sha }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH

  # ─────────────────────────────────────────────────────────────────────────────
  # Deploy to EKS via Helm (main branch only)
  # RDS endpoint fetched from CloudFormation outputs — no manual secret needed.
  # ALB DNS fetched from Kubernetes ingress after deploy.
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-to-eks:
    name: Deploy to EKS via Helm
    runs-on: ubuntu-latest
    needs: trivy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --name secureflow-cluster --region ${{ secrets.AWS_REGION }}

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Deploy via Helm
        env:
          ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
          IMAGE_TAG: ${{ github.sha }}
        run: |
          RDS_ENDPOINT=$(aws cloudformation describe-stacks \
            --stack-name secureflow-rds \
            --query "Stacks[0].Outputs[?OutputKey=='RDSEndpoint'].OutputValue" \
            --output text)
          
          helm upgrade --install secureflow ./helm/secureflow \
            --namespace secureflow \
            --create-namespace \
            --set image.repository=$ECR_REGISTRY/secureflow \
            --set image.tag=$IMAGE_TAG \
            --set db.url=jdbc:postgresql://$RDS_ENDPOINT:5432/secureflow \
            --set ingress.className=alb \
            --set ingress.host="" \
            --values helm/secureflow/values-eks.yaml

      - name: Fetch ALB DNS
        run: |
          echo "Waiting for ALB DNS to be assigned..."
          for i in $(seq 1 20); do
            ALB_DNS=$(kubectl get ingress secureflow -n secureflow \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")
            if [ -n "$ALB_DNS" ]; then
              echo "✅ ALB DNS: $ALB_DNS"
              echo "Run spike test: TARGET_URL=http://$ALB_DNS/api/users k6 run scripts/k6-spike.js"
              break
            fi
            echo "Waiting... ($i/20)"
            sleep 15
          done
