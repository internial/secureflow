name: SecureFlow CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Security & Quality Gates (run on every push and PR)
  # ─────────────────────────────────────────────────────────────────────────────
  git-secrets:
    name: git-secrets Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: git-secrets Secret Scan
        run: |
          git clone https://github.com/awslabs/git-secrets.git /tmp/git-secrets
          sudo make install -C /tmp/git-secrets
          git-secrets --register-aws
          if [ -f .git-secrets ]; then
            while IFS= read -r pattern; do
              [[ "$pattern" =~ ^#.*$ ]] && continue
              [[ -z "$pattern" ]] && continue
              git-secrets --add "$pattern" 2>/dev/null || true
            done < .git-secrets
          fi
          if ! git-secrets --scan; then
            echo "❌ SECURITY CHECK FAILED: Potential secrets found in repository!"
            exit 1
          fi
          echo "✅ No secrets found in repository"

  build-and-test:
    name: Build & Test (Java 21)
    runs-on: ubuntu-latest
    needs: git-secrets
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Compile and Test
        run: |
          cd app
          mvn -B clean verify

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/target/surefire-reports/

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build Application for CodeQL
        run: |
          cd app
          mvn -B clean package -DskipTests

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  checkov-cfnlint:
    name: Infrastructure Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Checkov Static Infrastructure Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: cloudformation
          framework: cloudformation
          quiet: true
          soft_fail: false

      - name: Install and Run cfn-lint
        run: |
          pip install cfn-lint
          cfn-lint cloudformation/**/*.yaml

  # ─────────────────────────────────────────────────────────────────────────────
  # Infrastructure Deployment (main branch only)
  # Deploys CloudFormation stacks in dependency order.
  # Uses create-stack for new stacks and update-stack for existing ones.
  # Safe to run on every push — skips stacks that are already up to date.
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-infrastructure:
    name: Deploy AWS Infrastructure (CloudFormation)
    runs-on: ubuntu-latest
    needs: [codeql, checkov-cfnlint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      rds-endpoint: ${{ steps.get-outputs.outputs.rds-endpoint }}
      oidc-url: ${{ steps.get-outputs.outputs.oidc-url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy or Update CloudFormation Stacks
        run: |
          deploy_stack() {
            local stack_name=$1
            local template=$2
            shift 2
            local extra_args=("$@")

            status=$(aws cloudformation describe-stacks \
              --stack-name "$stack_name" \
              --query "Stacks[0].StackStatus" \
              --output text 2>/dev/null || echo "DOES_NOT_EXIST")

            if [ "$status" = "DOES_NOT_EXIST" ]; then
              echo "Creating stack: $stack_name"
              aws cloudformation create-stack \
                --stack-name "$stack_name" \
                --template-body "file://$template" \
                "${extra_args[@]}"
              aws cloudformation wait stack-create-complete --stack-name "$stack_name"
              echo "✅ $stack_name created"
            elif [ "$status" = "CREATE_COMPLETE" ] || [ "$status" = "UPDATE_COMPLETE" ] || [ "$status" = "UPDATE_ROLLBACK_COMPLETE" ]; then
              echo "Updating stack: $stack_name"
              aws cloudformation update-stack \
                --stack-name "$stack_name" \
                --template-body "file://$template" \
                "${extra_args[@]}" 2>&1 | grep -v "No updates are to be performed" || true
              aws cloudformation wait stack-update-complete --stack-name "$stack_name" 2>/dev/null || true
              echo "✅ $stack_name up to date"
            else
              echo "⚠️ Stack $stack_name is in state $status — skipping"
            fi
          }

          # 1. VPC
          deploy_stack secureflow-vpc cloudformation/vpc.yaml

          # 2. IAM Base
          deploy_stack secureflow-iam-base cloudformation/iam-base.yaml \
            --capabilities CAPABILITY_NAMED_IAM

          # 3. EKS (depends on VPC + IAM)
          deploy_stack secureflow-eks cloudformation/eks.yaml

          # 4. IRSA — fetch OIDC URL from EKS stack output
          OIDC_URL=$(aws cloudformation describe-stacks \
            --stack-name secureflow-eks \
            --query "Stacks[0].Outputs[?OutputKey=='OIDCIssuerURL'].OutputValue" \
            --output text | sed 's|https://||')
          echo "OIDC URL: $OIDC_URL"
          deploy_stack secureflow-iam-irsa cloudformation/iam-irsa.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameters "ParameterKey=OidcProvider,ParameterValue=$OIDC_URL"

          # 5. RDS (depends on VPC + EKS security group)
          deploy_stack secureflow-rds cloudformation/rds.yaml

          # 6. ECR
          deploy_stack secureflow-ecr cloudformation/ecr.yaml

          # 7. Budgets
          deploy_stack secureflow-budgets cloudformation/budgets.yaml \
            --parameters "ParameterKey=NotificationEmail,ParameterValue=${{ secrets.NOTIFICATION_EMAIL }}"

      - name: Fetch Stack Outputs
        id: get-outputs
        run: |
          RDS_ENDPOINT=$(aws cloudformation describe-stacks \
            --stack-name secureflow-rds \
            --query "Stacks[0].Outputs[?OutputKey=='RDSEndpoint'].OutputValue" \
            --output text)
          echo "rds-endpoint=$RDS_ENDPOINT" >> $GITHUB_OUTPUT

          OIDC_URL=$(aws cloudformation describe-stacks \
            --stack-name secureflow-eks \
            --query "Stacks[0].Outputs[?OutputKey=='OIDCIssuerURL'].OutputValue" \
            --output text | sed 's|https://||')
          echo "oidc-url=$OIDC_URL" >> $GITHUB_OUTPUT

          echo "✅ RDS Endpoint: $RDS_ENDPOINT"

  # ─────────────────────────────────────────────────────────────────────────────
  # Docker Build & Push to ECR (main branch only, after infra is ready)
  # ─────────────────────────────────────────────────────────────────────────────
  docker-build-push:
    name: Docker Build & Push to ECR
    runs-on: ubuntu-latest
    needs: deploy-infrastructure
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: secureflow
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./app
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  # ─────────────────────────────────────────────────────────────────────────────
  # Trivy Container Scan (main branch only)
  # ─────────────────────────────────────────────────────────────────────────────
  trivy:
    name: Trivy Container Scan
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Trivy Image Scan
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker pull $ECR_REGISTRY/secureflow:$IMAGE_TAG
          trivy image --exit-code 1 --severity HIGH,CRITICAL $ECR_REGISTRY/secureflow:$IMAGE_TAG

  # ─────────────────────────────────────────────────────────────────────────────
  # Deploy to EKS via Helm (main branch only)
  # RDS endpoint fetched from CloudFormation outputs — no manual secret needed.
  # ALB DNS fetched from Kubernetes ingress after deploy.
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-to-eks:
    name: Deploy to EKS via Helm
    runs-on: ubuntu-latest
    needs: [trivy, deploy-infrastructure]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --name secureflow-cluster --region ${{ secrets.AWS_REGION }}

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.14.0'

      - name: Deploy via Helm
        env:
          ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
          IMAGE_TAG: ${{ github.sha }}
          RDS_ENDPOINT: ${{ needs.deploy-infrastructure.outputs.rds-endpoint }}
        run: |
          helm upgrade --install secureflow ./helm/secureflow \
            --namespace secureflow \
            --create-namespace \
            --set image.repository=$ECR_REGISTRY/secureflow \
            --set image.tag=$IMAGE_TAG \
            --set db.url=jdbc:postgresql://$RDS_ENDPOINT:5432/secureflow \
            --set ingress.className=alb \
            --set ingress.host="" \
            --values helm/secureflow/values-eks.yaml

      - name: Fetch ALB DNS
        run: |
          echo "Waiting for ALB DNS to be assigned..."
          for i in $(seq 1 20); do
            ALB_DNS=$(kubectl get ingress secureflow -n secureflow \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")
            if [ -n "$ALB_DNS" ]; then
              echo "✅ ALB DNS: $ALB_DNS"
              echo "Run spike test: TARGET_URL=http://$ALB_DNS/api/users k6 run scripts/k6-spike.js"
              break
            fi
            echo "Waiting... ($i/20)"
            sleep 15
          done
