# Server Configuration
server.port=8080

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/secureflow}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:secureflow}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:secureflow}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoints.web.base-path=/actuator
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=secureflow-api
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Application Name
spring.application.name=secureflow-api
