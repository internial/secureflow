AWSTemplateFormatVersion: '2010-09-09'
Description: 'SecureFlow IAM Roles: EKS Cluster Role and Node Group Role'

Resources:
  EksClusterRole:
    Type: 'AWS::IAM::Role'
    Properties:
      RoleName: 'secureflow-eks-cluster-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - 'eks.amazonaws.com'
            Action:
              - 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/AmazonEKSClusterPolicy'

  EksNodeRole:
    Type: 'AWS::IAM::Role'
    Properties:
      RoleName: 'secureflow-eks-node-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - 'ec2.amazonaws.com'
            Action:
              - 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy'
        - 'arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy'
        - 'arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly'

Outputs:
  EksClusterRoleArn:
    Value: !GetAtt EksClusterRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-EksClusterRoleArn'
  EksNodeRoleArn:
    Value: !GetAtt EksNodeRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-EksNodeRoleArn'
