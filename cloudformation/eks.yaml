AWSTemplateFormatVersion: '2010-09-09'
Description: 'SecureFlow EKS Cluster Infrastructure (Kubernetes 1.29) and Node Group'

Parameters:
  VpcStackName:
    Type: String
    Default: 'secureflow-vpc'
    Description: 'Name of the VPC stack to import subnet and security values'

  IamBaseStackName:
    Type: String
    Default: 'secureflow-iam-base'
    Description: 'Name of the IAM Base stack to import cluster and node role ARNs'

Resources:
  EksSecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      GroupDescription: 'EKS Control Plane Security Group'
      VpcId:
        Fn::ImportValue: !Sub '${VpcStackName}-VpcId'
      Tags:
        - Key: Name
          Value: 'secureflow-eks-sg'

  EksCluster:
    Type: 'AWS::EKS::Cluster'
    Properties:
      Name: 'secureflow-cluster'
      Version: '1.29'
      RoleArn:
        Fn::ImportValue: !Sub '${IamBaseStackName}-EksClusterRoleArn'
      ResourcesVpcConfig:
        SecurityGroupIds:
          - !Ref EksSecurityGroup
        SubnetIds:
          Fn::Split:
            - ','
            - Fn::ImportValue: !Sub '${VpcStackName}-PrivateSubnets'

  EksNodeGroup:
    Type: 'AWS::EKS::Nodegroup'
    DependsOn: EksCluster
    Properties:
      ClusterName: !Ref EksCluster
      NodegroupName: 'secureflow-node-group'
      NodeRole:
        Fn::ImportValue: !Sub '${IamBaseStackName}-EksNodeRoleArn'
      Subnets:
        Fn::Split:
          - ','
          - Fn::ImportValue: !Sub '${VpcStackName}-PrivateSubnets'
      InstanceTypes:
        - 't3.medium'
        - 't3a.medium'
      CapacityType: SPOT
      ScalingConfig:
        MinSize: 1
        MaxSize: 3
        DesiredSize: 2
      DiskSize: 20

Outputs:
  ClusterName:
    Value: !Ref EksCluster
    Export:
      Name: !Sub '${AWS::StackName}-ClusterName'
  ClusterEndpoint:
    Value: !GetAtt EksCluster.Endpoint
    Export:
      Name: !Sub '${AWS::StackName}-ClusterEndpoint'
  # EKS OIDC Issuer URL
  OIDCIssuerURL:
    Value: !GetAtt EksCluster.OpenIdConnectIssuerUrl
    Export:
      Name: !Sub '${AWS::StackName}-OIDCIssuerURL'
  EksNodeSecurityGroup:
    # Exports node security group if generated by cluster resource auto-mapping
    Value: !GetAtt EksCluster.ClusterSecurityGroupId
    Export:
      Name: !Sub '${AWS::StackName}-ClusterSecurityGroupId'
