apiVersion: v1
kind: Secret
metadata:
  name: {{ include "secureflow.fullname" . }}-secret
  labels:
    {{- include "secureflow.labels" . | nindent 4 }}
type: Opaque
data:
  SPRING_DATASOURCE_USERNAME: {{ .Values.db.username | b64enc | quote }}
  SPRING_DATASOURCE_PASSWORD: {{ .Values.db.password | b64enc | quote }}
