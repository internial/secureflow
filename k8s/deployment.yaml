apiVersion: apps/v1
kind: Deployment
metadata:
  name: secureflow
  namespace: secureflow
  labels:
    app.kubernetes.io/name: secureflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: secureflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: secureflow
    spec:
      containers:
      - name: secureflow-api
        image: secureflow-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        env:
        - name: SPRING_DATASOURCE_URL
          valueFrom:
            configMapKeyRef:
              name: secureflow-config
              key: SPRING_DATASOURCE_URL
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: secureflow-secret
              key: SPRING_DATASOURCE_USERNAME
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: secureflow-secret
              key: SPRING_DATASOURCE_PASSWORD
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 3
