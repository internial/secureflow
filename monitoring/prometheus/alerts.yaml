groups:
  - name: secureflow-alerts
    rules:
      - alert: HighLatency
        expr: histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket[5m])) by (le)) > 0.3
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High Latency detected on SecureFlow"
          description: "p95 Response time has exceeded 300ms (current: {{ $value }}s) for more than 5 minutes."

      - alert: HighErrorRate
        expr: (sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / sum(rate(http_server_requests_seconds_count[5m]))) * 100 > 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High Error Rate detected"
          description: "More than 1% of requests are returning 5xx errors (current: {{ $value }}%) over the last 5 minutes."

      - alert: PodCrashLooping
        expr: increase(kube_pod_container_status_restarts_total[5m]) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Pod is crashlooping"
          description: "Pod container restarts have exceeded 3 within 5 minutes."

      - alert: MemorySpike
        expr: (container_memory_working_set_bytes{container="secureflow-api"} > 471859200) or (jvm_memory_used_bytes{area="heap"} > 471859200)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory utilization"
          description: "Memory utilization exceeds 450Mi (current value: {{ $value | humanize1024 }}B) for more than 5 minutes."

      - alert: DeploymentFailed
        expr: kube_deployment_status_replicas_unavailable > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Deployment Failed"
          description: "Unavailable replicas exist for deployment for more than 5 minutes."

      - alert: HighCPU
        expr: (system_cpu_usage > 0.8) or (rate(container_cpu_usage_seconds_total{container="secureflow-api"}[5m]) > 0.8)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU utilization"
          description: "SecureFlow system CPU usage has exceeded 80% (current: {{ $value }}%) for more than 5 minutes."
